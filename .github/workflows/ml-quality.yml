name: ML quality
on:
  pull_request:
  push:
    branches: [main, homework/ml-production]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenMP runtime for LightGBM on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install poetry==2.2.1
      - uses: actions/cache@v4
        with:
          path: ml/.venv
          key: ml-${{ runner.os }}-${{ runner.arch }}-py312-poetry221-${{ hashFiles('ml/poetry.lock') }}
      - run: poetry -C ml sync --with dev
      - run: poetry -C ml check --lock
      - run: poetry -C ml run ruff check src tests
      - run: poetry -C ml run ruff format --check src tests
      - run: poetry -C ml run pytest tests
      - run: poetry build
        working-directory: ml
